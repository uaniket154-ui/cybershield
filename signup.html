<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberShield | Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-brand">
        <div class="brand-icon">🛡️</div>
        <h1>CyberShield</h1>
        <p>Cyber Crime Awareness & Prevention</p>
    </div>

    <div class="auth-card">

        <h2>Create Account</h2>
        <p class="auth-subtitle">
            Join CyberShield and participate in cyber awareness workshops.
        </p>

        <form id="signupForm">

            <label>Full Name</label>
            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
                required
            >

            <label>Email Address</label>
            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                required
            >

            <label>Phone Number</label>
            <input
                type="tel"
                id="signupPhone"
                placeholder="Enter your phone number"
                required
            >

            <label>Institution</label>
            <input
                type="text"
                id="signupInstitution"
                placeholder="College / School / Organization"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <button type="submit" class="auth-button">
                Create Account
            </button>

            <p id="signupMessage" class="auth-message"></p>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <div class="back-home">
            <a href="index.html">← Back to CyberShield</a>
        </div>

    </div>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>
