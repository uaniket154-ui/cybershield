<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberShield | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-brand">
        <div class="brand-icon">🛡️</div>
        <h1>CyberShield</h1>
        <p>Cyber Crime Awareness & Prevention</p>
    </div>

    <div class="auth-card">

        <h2>Welcome Back</h2>

        <p class="auth-subtitle">
            Login to access your CyberShield account.
        </p>

        <form id="loginForm">

            <label>Email Address</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="auth-button">
                Login
            </button>

            <p id="loginMessage" class="auth-message"></p>

        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </div>

        <div class="admin-link">
            <a href="admin.html">🛡️ Admin Dashboard</a>
        </div>

        <div class="back-home">
            <a href="index.html">← Back to CyberShield</a>
        </div>

    </div>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>
